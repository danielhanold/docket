# agents/harness-defaults.yml — docket's shipped per-harness agent model/effort/cache-TTL table.
#
# This is program data, not a user configuration file. The docket binary compiles the same table
# into its built-in agent defaults (internal/config/defaults.go), and a test keeps the two equal.
#
# Only the global configuration (${XDG_CONFIG_HOME:-~/.config}/docket/config.yml) overrides it.
# Overrides apply per agent and per field; the repository layers (.docket.yml and
# .docket.local.yml) never override agent pins.
#
# Shape rules:
#   - every entry nests under a concrete harness; there is no harness-neutral `default:` block,
#     because one model ID never fits every harness's roster;
#   - keys are wrapper short names (build-economy, not docket-build-economy);
#   - every listed entry supplies both model and effort;
#   - an entry may add an optional `cache_ttl` (a prompt-cache TTL; only Claude Code has the
#     setting). It ships on claude's implement-next alone; see the comment on that row;
#   - every shipped harness (claude, cursor, codex, opencode) carries a complete 17-agent block.
#
# Model IDs and effort tokens are opaque passthrough values (ADR-0015). Docket keeps no vendor
# allowlist; an unrecognized string is never rejected here.
agents:
  claude:
    adr:                   { model: claude-opus-5-5, effort: low }
    auto-groom:            { model: claude-opus-5-5, effort: medium }
    auto-groom-critic:     { model: claude-opus-5-5, effort: high }
    brainstorm-consultant: { model: claude-opus-5-5, effort: medium }
    # build-economy runs Opus at low effort rather than a smaller model deliberately: the worker
    # contract is long and strict, and its failure modes (malformed return, stray commit,
    # unverifiable COMPLETE) HALT the build instead of escalating, so contract-fumble risk lands on
    # the human. Haiku (claude-haiku-5-5) is the documented cost-aggressive user-layer override, not
    # a shipped default.
    build-economy:         { model: claude-opus-5-5, effort: low }
    build-standard:        { model: claude-opus-5-5, effort: medium }
    build-premium:         { model: claude-opus-5-5, effort: high }
    build-max:             { model: claude-opus-5-5, effort: xhigh }
    finalize-change:       { model: claude-opus-5-5, effort: low }
    # implement-next waits on build workers and the test suite for longer than Claude Code's
    # 5-minute subagent prompt cache lasts, so most of its cost went to writing its whole context
    # into the cache again after each wait. A 1-hour TTL roughly halves its cost per run. The
    # other agents rarely wait five minutes between turns, and a 1-hour cache write costs more
    # than a 5-minute one, so they keep Claude Code's default.
    implement-next:        { model: claude-opus-5-5, effort: low, cache_ttl: 1h }
    integration-repair:    { model: claude-opus-5-5, effort: medium }
    plan-writer:           { model: claude-opus-5-5, effort: high }
    rebase-resolver:       { model: claude-opus-5-5, effort: medium }
    # The review tiers price REVIEW work directly rather than shifting the build ladder by one: a
    # read-and-return reviewer spends its budget reading a whole branch, not assembling one.
    review-lean:           { model: claude-opus-5-5, effort: low }
    review-standard:       { model: claude-opus-5-5, effort: medium }
    review-deep:           { model: claude-opus-5-5, effort: high }
    status:                { model: claude-haiku-5-5, effort: medium }

  # Cursor's full wrapper set. Each ID is a COMPLETE Cursor built-in whose variant is already
  # encoded, so effort is `auto`: the Cursor emitter writes the ID verbatim rather than appending
  # a second, conflicting `[effort=…]` suffix. Most rows run Grok 4.6 at the level its name
  # carries, the three review tiers run Grok 4.7, and status, plan-writer, and build-max run
  # Claude models selected through Cursor under Cursor's own IDs.
  cursor:
    adr:                   { model: cursor-grok-4.6-high, effort: auto }
    auto-groom:            { model: cursor-grok-4.6-medium, effort: auto }
    auto-groom-critic:     { model: cursor-grok-4.6-high, effort: auto }
    brainstorm-consultant: { model: cursor-grok-4.6-high, effort: auto }
    build-economy:         { model: cursor-grok-4.6-low, effort: auto }
    build-standard:        { model: cursor-grok-4.6-medium, effort: auto }
    build-premium:         { model: cursor-grok-4.6-high, effort: auto }
    build-max:             { model: claude-opus-5-5-high, effort: auto }
    finalize-change:       { model: cursor-grok-4.6-low, effort: auto }
    implement-next:        { model: cursor-grok-4.6-low, effort: auto }
    integration-repair:    { model: cursor-grok-4.6-high, effort: auto }
    plan-writer:           { model: claude-opus-5-5-medium, effort: auto }
    rebase-resolver:       { model: cursor-grok-4.6-high, effort: auto }
    review-lean:           { model: grok-4.7-low, effort: auto }
    review-standard:       { model: grok-4.7-medium, effort: auto }
    review-deep:           { model: grok-4.7-high, effort: auto }
    status:                { model: claude-haiku-5-5-thinking-medium, effort: auto }

  # Codex's full wrapper set. Codex takes a real reasoning-effort token per agent,
  # so unlike the cursor block every row carries a distinct model/effort PAIR rather than `auto`.
  #
  # The tier names describe the capability/cost role of a complete pair, NOT a cross-model
  # ordinal: reasoning tokens are model-specific settings, so `xhigh` on Luna is not "stronger
  # than" `medium` on Sol.
  # The build ladder is therefore Luna/xhigh for the economy tier, Terra/medium for the standard
  # tier, Sol/low for the premium tier, and Sol/medium for the rare max tier — note Sol
  # appears twice at different efforts, which is the point: the pair is the role, not the model.
  codex:
    adr:                   { model: gpt-5.6-terra, effort: xhigh }
    auto-groom:            { model: gpt-5.6-sol, effort: low }
    auto-groom-critic:     { model: gpt-5.6-sol, effort: medium }
    brainstorm-consultant: { model: gpt-5.6-sol, effort: medium }
    build-economy:         { model: gpt-5.6-luna, effort: xhigh }
    build-standard:        { model: gpt-5.6-terra, effort: medium }
    build-premium:         { model: gpt-5.6-sol, effort: low }
    build-max:             { model: gpt-5.6-sol, effort: medium }
    finalize-change:       { model: gpt-5.6-terra, effort: high }
    implement-next:        { model: gpt-5.6-sol, effort: medium }
    integration-repair:    { model: gpt-5.6-sol, effort: high }
    plan-writer:           { model: gpt-5.6-terra, effort: high }
    rebase-resolver:       { model: gpt-5.6-sol, effort: high }
    review-lean:           { model: gpt-5.6-terra, effort: medium }
    review-standard:       { model: gpt-5.6-terra, effort: high }
    review-deep:           { model: gpt-5.6-sol, effort: medium }
    status:                { model: gpt-5.6-luna, effort: xhigh }

  # opencode's full wrapper set. opencode has no first-class effort token; it passes
  # unrecognized agent-frontmatter keys through to the provider as model options, so docket emits
  # the effort as `reasoningEffort:` and it arrives as a real per-agent reasoning effort. Verified
  # against opencode 1.18.11 via `opencode debug agent`, which reports it under `options`.
  #
  # Models are reached through OpenRouter, so IDs are double-prefixed (`openrouter/<vendor>/<id>`).
  # The table is three models, chosen for very cheap
  # high intelligence: DeepSeek V4 Flash carries every volume row (sweep, grooming, orchestration,
  # the economy and standard build tiers, the lean review tier), Kimi K3 carries the judgment rows
  # — design prose, ADRs, merge-intent reconstruction, red-suite repair — and the ladder top,
  # appearing at two efforts exactly as Sol does in the codex block, and GPT-5.6 Luna is one
  # deliberate diversity row so the adversarial critic does not share the drafter's blind spots.
  #
  # As in every other block the PAIR is the role, not the model: `high` on Flash is not "stronger
  # than" `medium` on Kimi. Efforts cap at `high` — reasoning-effort vocabularies are
  # model-specific and xhigh-class tokens are not assumed portable here.
  opencode:
    adr:                   { model: openrouter/moonshotai/kimi-k3, effort: medium }
    auto-groom:            { model: openrouter/deepseek/deepseek-v4-flash-0731, effort: medium }
    auto-groom-critic:     { model: openrouter/openai/gpt-5.6-luna, effort: high }
    brainstorm-consultant: { model: openrouter/moonshotai/kimi-k3, effort: medium }
    build-economy:         { model: openrouter/deepseek/deepseek-v4-flash-0731, effort: medium }
    build-standard:        { model: openrouter/deepseek/deepseek-v4-flash-0731, effort: high }
    build-premium:         { model: openrouter/moonshotai/kimi-k3, effort: medium }
    build-max:             { model: openrouter/moonshotai/kimi-k3, effort: high }
    finalize-change:       { model: openrouter/deepseek/deepseek-v4-flash-0731, effort: high }
    implement-next:        { model: openrouter/deepseek/deepseek-v4-flash-0731, effort: high }
    integration-repair:    { model: openrouter/moonshotai/kimi-k3, effort: high }
    plan-writer:           { model: openrouter/deepseek/deepseek-v4-pro-0813, effort: medium }
    rebase-resolver:       { model: openrouter/moonshotai/kimi-k3, effort: high }
    review-lean:           { model: openrouter/deepseek/deepseek-v4-flash-0731, effort: high }
    review-standard:       { model: openrouter/moonshotai/kimi-k3, effort: medium }
    review-deep:           { model: openrouter/moonshotai/kimi-k3, effort: high }
    status:                { model: openrouter/deepseek/deepseek-v4-flash-0731, effort: low }
