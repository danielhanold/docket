# agents/harness-defaults.yml — docket's SHIPPED per-harness agent model/effort defaults.
#
# This is program data, NOT a user configuration file. It is the lowest layer of the agent
# resolution order; every user layer (machine-local .docket.local.yml, committed .docket.yml,
# global config.yml) overrides it FIELD BY FIELD. See ADR-0016 and the agent-layer reference.
#
# Rules this file must satisfy (enforced by scripts/lib/harness-defaults.sh, run before
# sync-agents.sh writes any wrapper):
#   - every entry nests under a CONCRETE harness; a harness-neutral `default:` block is forbidden,
#     because that is exactly the cross-harness model leakage this file exists to remove;
#   - keys are wrapper SHORT names (build-low, not docket-build-low);
#   - a listed entry supplies BOTH model and effort — the table is sparse by harness and agent,
#     never by field;
#   - `runner:` is forbidden — delegation is user policy, never a shipped default;
#   - every harness listed in HD_SHIPPED_HARNESSES carries a COMPLETE block (its key set equals
#     agents/docket-*.md) — claude, cursor, and codex today.
#
# Model IDs and effort tokens are opaque passthrough values (ADR-0015). Docket keeps no vendor
# allowlist; an unrecognized string is never rejected here. They must, however, be written as BARE
# scalars — unquoted and space-free — because the reader consumes everything up to the next `,` or
# `}`. A provider-prefixed ID (`anthropic/claude-opus-5`, `openai:gpt-5.6-sol`) is fine; a quoted
# or space-bearing value is rejected by hd_validate with a diagnostic naming the bareness rule,
# rather than being silently clipped to a prefix.
agents:
  claude:
    adr:                   { model: claude-opus-5, effort: low }
    auto-groom:            { model: claude-opus-5, effort: low }
    auto-groom-critic:     { model: claude-opus-5, effort: medium }
    brainstorm-consultant: { model: claude-opus-5, effort: medium }
    # build-low ships Sonnet rather than Haiku deliberately: the worker contract is long and strict,
    # and its failure modes (malformed return, stray commit, unverifiable COMPLETE) HALT the build
    # instead of escalating, so contract-fumble risk lands on the human. Haiku
    # (claude-haiku-4-5-20251001) is the documented cost-aggressive user-layer override, not a
    # shipped default.
    build-low:             { model: claude-sonnet-5, effort: low }
    build-medium:          { model: claude-opus-5, effort: low }
    build-high:            { model: claude-opus-5, effort: medium }
    build-max:             { model: claude-opus-5, effort: high }
    finalize-change:       { model: claude-opus-5, effort: low }
    implement-next:        { model: claude-opus-5, effort: medium }
    integration-repair:    { model: claude-opus-5, effort: medium }
    rebase-resolver:       { model: claude-opus-5, effort: medium }
    status:                { model: claude-haiku-4-5-20251001, effort: medium }

  # Cursor's full wrapper set. Each ID is a COMPLETE Cursor built-in whose variant is already
  # encoded, so effort is `auto`: the Cursor emitter writes the ID verbatim rather than appending
  # a second, conflicting `[effort=…]` suffix. The tiering mirrors the claude block's intent —
  # cheapest for the mechanical status sweep, mid for design and repair work, highest for the
  # max build profile — expressed in Cursor's variant suffixes instead of an effort token.
  cursor:
    adr:                   { model: cursor-grok-4.5-high, effort: auto }
    auto-groom:            { model: cursor-grok-4.5-medium, effort: auto }
    auto-groom-critic:     { model: cursor-grok-4.5-high, effort: auto }
    brainstorm-consultant: { model: cursor-grok-4.5-high, effort: auto }
    build-low:             { model: cursor-grok-4.5-low, effort: auto }
    build-medium:          { model: cursor-grok-4.5-medium, effort: auto }
    build-high:            { model: cursor-grok-4.5-high, effort: auto }
    build-max:             { model: claude-opus-5-high, effort: auto }
    finalize-change:       { model: cursor-grok-4.5-high-fast, effort: auto }
    implement-next:        { model: cursor-grok-4.5-high, effort: auto }
    integration-repair:    { model: cursor-grok-4.5-high, effort: auto }
    rebase-resolver:       { model: cursor-grok-4.5-high, effort: auto }
    status:                { model: cursor-grok-4.5-low-fast, effort: auto }

  # Codex's full wrapper set (change 0169). Codex takes a real reasoning-effort token per agent,
  # so unlike the cursor block every row carries a distinct model/effort PAIR rather than `auto`.
  #
  # The profile names describe the capability/cost role of a complete pair, NOT a cross-model
  # ordinal: reasoning tokens are model-specific settings, so `xhigh` on Luna is not "stronger
  # than" `medium` on Sol.
  # The build ladder is therefore Luna/xhigh for positively established low-risk work, Terra/medium
  # for ordinary work, Sol/low for named risk, and Sol/medium for the rare top rung — note Sol
  # appears twice at different efforts, which is the point: the pair is the role, not the model.
  codex:
    adr:                   { model: gpt-5.6-terra, effort: xhigh }
    auto-groom:            { model: gpt-5.6-sol, effort: low }
    auto-groom-critic:     { model: gpt-5.6-sol, effort: medium }
    brainstorm-consultant: { model: gpt-5.6-sol, effort: medium }
    build-low:             { model: gpt-5.6-luna, effort: xhigh }
    build-medium:          { model: gpt-5.6-terra, effort: medium }
    build-high:            { model: gpt-5.6-sol, effort: low }
    build-max:             { model: gpt-5.6-sol, effort: medium }
    finalize-change:       { model: gpt-5.6-terra, effort: high }
    implement-next:        { model: gpt-5.6-sol, effort: medium }
    integration-repair:    { model: gpt-5.6-sol, effort: high }
    rebase-resolver:       { model: gpt-5.6-sol, effort: high }
    status:                { model: gpt-5.6-luna, effort: xhigh }
