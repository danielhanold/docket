# runners — per-runner knobs for RUNNER DELEGATION (change 0079): handing an agent's whole run to
# a child harness with its own subscription, models, and skills. Activated per agent by an explicit
# `runner:` key inside an `agents:` entry — never inferred from model IDs. Three pairs ship today,
# all with parent `claude` (Claude Code): children `codex` (OpenAI Codex CLI), `cursor` (Cursor
# CLI), and `opencode`. A delegated agent MUST carry an explicit `model:` in your own config — a
# shipped default is never forwarded to another harness, so a model-less delegation is a
# generation-time error rather than a silent run on the child's own default. With no agent carrying
# a `runner:` key, this block is inert.
# scope: any layer (.docket.yml, .docket.local.yml, or global config.yml)
runners:
  codex:
    sandbox: workspace-write   # workspace-write (default) | danger-full-access
    network: true              # default true — git push and gh need it
    # shim_model / shim_effort — what the small relay agent in YOUR harness runs on. Delegation
    # generates a two-part wrapper: a relay that runs here in Claude Code and makes one call out to
    # the child, and the child that does the actual work on the `model:` you set under `agents:`.
    # These two keys pin the RELAY; they never touch the child. Leave them alone and the relay runs
    # on whatever model your session is using (`inherit`), which is always correct. Set shim_model
    # to a cheap model if you would rather not spend session-model tokens on a call that only waits
    # for output and passes it back. Available under every runner, not just codex.
    shim_model: inherit        # default inherit — any model ID YOUR harness can run
    shim_effort: low           # default low
  opencode:
    permissions: ask           # ask (default — REFUSES to delegate) | auto-approve


# ═══ Pluggable workflow skills ═════════════════════════════════════════════════════════════

# skills — (change 0049) rebinds any of the five workflow invocation points — brainstorm / plan /
# build / review / finish — to a different skill (the name passes to the Skill tool verbatim,
# unvalidated) or to `auto` (no skill; the running agent performs the step inline at its own
# model — e.g. `build: auto` to build with no fan-out at all). Note that `build: auto` is
# DUAL-PURPOSE: it authorizes inline building AND the in-branch fix workers docket-implement-next
# runs on review findings, which execute the build role's own contract — one switch, two kinds of
# inline work, and deliberately no `skills.fix` key. Unset keys default to the values
# shown: superpowers for brainstorm / plan / finish, and docket's own build and review roles
# since change 0193. To run the superpowers engine everywhere instead, set `build:
# superpowers:subagent-driven-development` and `review: superpowers:requesting-code-review`
# explicitly. A resolved-but-unavailable skill degrades to that role's `auto` fallback with a
# prominent warning. Unknown role keys are warned + ignored. Shape and per-role fallback
# artifacts: docket-convention "Skill layer".
# scope: any layer (.docket.yml, .docket.local.yml, or global config.yml)
skills:
  brainstorm: superpowers:brainstorming
  plan:       superpowers:writing-plans
  build:      docket-build
  review:     docket-review
  finish:     superpowers:finishing-a-development-branch
