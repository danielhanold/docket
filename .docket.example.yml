# .docket.example.yml — docket's canonical, all-comprehensive configuration reference.
#
# THIS FILE IS DOCUMENTATION. No docket tooling ever reads it: the resolver reads `.docket.yml`
# from your repo's default branch (origin/HEAD). This file exists so that every key, its shipped
# default, its meaning, and the layers it may be set in are visible in ONE place. Tests keep it
# honest (tests/test_docket_example_yml.sh).
#
# ── The four layers ────────────────────────────────────────────────────────────────────────
# Configuration resolves PER KEY, with precedence:
#   1. repo-local    <repo>/.docket.local.yml                     (this machine, this repo; gitignored)
#   2. repo-committed <repo>/.docket.yml                          (every clone — committed on origin/HEAD)
#   3. global        ${XDG_CONFIG_HOME:-~/.config}/docket/config.yml  (this machine, every repo)
#   4. built-in      docket's shipped defaults — agents/harness-defaults.yml (mirrored below)
# Every nested block — `runtime:`, `skills:`, `agents:`, `learnings:`, `reclaim:`, `runners:` —
# merges LEAF BY LEAF with the same precedence, never whole-block. Setting one leaf in a higher
# layer leaves the block's other leaves resolving from the layers below. `runtime:` is the one
# scope exception: machine-local only, so its chain skips repo-committed.
#
# ── How to use this file ───────────────────────────────────────────────────────────────────
# Copy the keys you want to CHANGE into the layer you want them in. Do not copy the whole file
# unless you mean to. An unedited full copy behaves identically to no file at all ONLY in the
# repo-committed `.docket.yml`, since every active value here IS the shipped default. Two
# exceptions:
#   - The PRESENCE-SENSITIVE keys ship commented because uncommenting them changes behavior even
#     at their default values.
#   - In the two MACHINE-SCOPED layers (`.docket.local.yml`, global `config.yml`), a full copy
#     makes the eight `scope: repo-only` keys warn on EVERY docket invocation — they are
#     coordination-fenced and warned-and-ignored there. Copy only `scope: any layer` keys into
#     those two files.
#
# ── Scope tags ─────────────────────────────────────────────────────────────────────────────
# Every key carries one:
#   # scope: repo-only (coordination-fenced, ADR-0019)
#       Writes shared, non-re-derivable state. Settable ONLY in the repo's committed .docket.yml;
#       a value in .docket.local.yml or the global config is loudly warned-and-ignored.
#   # scope: any layer (.docket.yml, .docket.local.yml, or global config.yml)
#       Behavioral only. Per-machine divergence is benign.
#   # scope: local-only (.docket.local.yml or global config.yml; never committed)
#       Identifies machine-specific tooling. A committed value is loudly warned-and-ignored.
# The authoritative classification lives in scripts/docket-config.md; this file mirrors it.
#
# ── THE STANDING RULE ──────────────────────────────────────────────────────────────────────
# EVERY new config flag lands in THIS FILE — its value AND its documentation — in the SAME PR
# that introduces it. tests/test_docket_example_yml.sh enforces it: a new key with no entry here
# fails the suite. This rule is why the file is worth having; without it the file drifts and
# becomes the fourth stale surface it was created to replace.


# ═══ Runtime ═══════════════════════════════════════════════════════════════════════════════

# runtime.bash — the absolute executable path to Bash 4 or newer used for Docket-owned shell
# execution. install.sh discovers a qualifying interpreter, validates its major version, and
# writes this machine-specific value to global config. Override it for one clone in
# .docket.local.yml. Missing, relative, non-executable, or Bash <4 values fail closed with the
# install/upgrade remedy; a committed runtime is warned-and-ignored.
# scope: local-only (.docket.local.yml or global config.yml; never committed)
# runtime:
#   bash: /opt/homebrew/bin/bash


# ═══ Branch model & layout ═════════════════════════════════════════════════════════════════

# metadata_branch — where planning metadata lives. `docket` (the default) puts the repo in
# DOCKET-MODE (migrate an existing repo with migrate-to-docket.sh — change 0002): changes, the
# board, ADRs, and specs are the live surface on the `docket` branch, checked out into a
# <repo>/.docket worktree, while the integration branch keeps code, build artifacts, and
# published terminal records. `main` opts out to single-branch mode, where planning metadata
# sits beside the code on the integration branch and no .docket worktree is used. Only those
# two values parse — anything else is a hard startup error.
# scope: repo-only (coordination-fenced, ADR-0019)
metadata_branch: docket

# integration_branch — the branch code lands on, i.e. where PRs merge. `auto` (the default)
# resolves to the repo's default branch, origin/HEAD; name a branch explicitly (`main`,
# `develop`) to point docket at a different code line. In DOCKET-MODE the named ref must exist on
# origin, or startup fails closed rather than guessing (docket-config.sh's Stage 3 bootstrap guard
# reads it via `g ls-tree "origin/$INTEGRATION_BRANCH"`, which dies on a non-zero exit rather than
# reading it as ¬LIVE); in main-mode the resolver does not validate the ref.
# scope: repo-only (coordination-fenced, ADR-0019)
integration_branch: auto

# changes_dir / adrs_dir / results_dir — where docket's three markdown ledgers live, relative to
# the repo root on the metadata branch: change files plus the derived board; the immutable ADR
# ledger; and published results records.
# scope: repo-only (coordination-fenced, ADR-0019)
changes_dir: docs/changes
adrs_dir: docs/adrs
results_dir: docs/results


# ═══ finalize — the merge gate ═════════════════════════════════════════════════════════════

# The finalize merge gate (change 0015): rebase the feature branch onto the integration branch
# and re-validate the merged result before docket merges, so a behind-base PR can't land a
# semantically-broken integration branch.
finalize:
  # gate — local (default, on) | ci | both | off. `off` restores pre-0015 behavior: merge
  # trusting the PR's own CI, with no local rebase-and-retest.
  # scope: any layer (.docket.yml, .docket.local.yml, or global config.yml)
  gate: local

  # test_command — the suite the gate runs. `auto` (default) is the explicit spelling of UNSET:
  # finalize auto-detects the suite. Set a real command only to override a wrong guess. The
  # sentinel is resolved away before any consumer sees it — finalize would otherwise try to RUN
  # `auto` as a shell command.
  # scope: any layer (.docket.yml, .docket.local.yml, or global config.yml)
  test_command: auto

  # require_pr_approval — governs the AUTO-DETECT finalize path only. false (default): docket
  # merges an eligible implemented change without requiring a GitHub approval. true: the no-arg
  # path REFUSES to merge a PR whose reviewDecision != APPROVED, surfacing it instead.
  # An explicit `docket-finalize-change <id>` (or an id allowlist) always OVERRIDES this —
  # naming the id IS the authorization.
  # scope: any layer (.docket.yml, .docket.local.yml, or global config.yml)
  require_pr_approval: false

  # skip_results_only_delta — saves a redundant test run before merging (change 0190).
  # Before merging, finalize re-runs the test suite unless it can prove the tests already passed on
  # exactly this code. By default, "proof" means an exact match: the commit that was tested IS the
  # commit being merged. The catch is that docket writes a results doc AFTER testing, which moves
  # the branch and breaks that match — so on most changes the suite runs a second time for nothing.
  # Set this true to also accept a near-match: the tested commit is an ancestor of what's being
  # merged, and every file added since then lives under `results_dir` above.
  # Only turn it on if no test in your suite READS files out of that directory. If one does, adding
  # a results doc there could change what the suite says, and this would merge without re-checking.
  # docket proves its own suite ignores that tree in tests/test_skip_allowlist_invisibility.sh.
  # Unlike the finalize keys above — preferences, which may differ per machine — this one states a
  # FACT about one repo's test suite, so it is only honored in that repo's own .docket.yml.
  # scope: repo-only (coordination-fenced, ADR-0019)
  skip_results_only_delta: false


# ═══ learnings — the build loop's memory ═══════════════════════════════════════════════════

# The learnings subsystem (change 0067). Findings live in <changes_dir>/learnings/ (one curated
# finding per file) with a GENERATED README.md index; groom/plan/review load the index and pull
# only relevant findings.
learnings:
  # enabled — the read GATE for the learnings subsystem: false makes readers skip (zero token
  # cost), true lets groom/plan/review pull relevant findings from the index. It is a read GATE,
  # never a purge: existing learnings/ files are left untouched and re-enabling resumes from them.
  # The WRITE side is deferred: automated learnings harvest is deferred from Go v1 — record or
  # update findings by editing `learnings/` files directly; automated learnings-index rendering is
  # deferred from Go v1 — existing `learnings/README.md` bytes are preserved, not refreshed.
  # scope: any layer (.docket.yml, .docket.local.yml, or global config.yml)
  enabled: true

  # cap — the ACTIVE-finding count past which the ledger is considered to need curation. automated
  # learnings capacity and promotion are deferred from Go v1 — ledger curation is human-directed;
  # the value is preserved as parseable configuration and docket never auto-merges its own memory.
  # scope: any layer (.docket.yml, .docket.local.yml, or global config.yml)
  cap: 300


# ═══ reclaim — self-healing stale claims ═══════════════════════════════════════════════════

# The reclaim subsystem (change 0089) — expired in-progress claims self-heal back to proposed.
# A crashed docket-implement-next leaves a change stuck at in-progress; a claim lease (claimed_at:,
# stamped at claim) + this TTL let a deterministic reclaim pass flip an EXPIRED, NO-BRANCH claim
# back to build-ready proposed. Detection is always on (docket-status flags + recommends);
# MUTATION is opt-in.
reclaim:
  # lease_ttl — generous hours, >= the 3-day stale-in-progress window.
  # scope: any layer (.docket.yml, .docket.local.yml, or global config.yml)
  lease_ttl: 72

  # auto — false (default) => flag + recommend only. true => docket-status self-heals each pass.
  # scope: any layer (.docket.yml, .docket.local.yml, or global config.yml)
  auto: false


# ═══ build — the docket-owned build role ═══════════════════════════════════════════════════

# Knobs for docket's own build role, docket-build (change 0167) — the lean, profile-routed build
# that has been the shipped default for `skills: build:` since change 0193. Inert if you rebind
# that role away from docket-build.
build:
  # checkpoint — false (default) => the build persists NO resume ledger; completed work is durable
  # through the per-task code commits alone, and a resumed run reconstructs progress conservatively
  # from the plan, commits, code, and tests. true => docket-build writes a compact state ledger to
  # the gitignored .superpowers/docket-build/<change-id>/progress.md, and a resumed task is skipped
  # only when its entry is COMPLETE, the plan hash still matches, and its commit is an ancestor of
  # the branch. Anything other than true/false is a config error, not a silent fallback.
  # scope: any layer (.docket.yml, .docket.local.yml, or global config.yml)
  checkpoint: false


# ═══ review — the docket-owned review role ═════════════════════════════════════════════════

# Knobs for what docket-implement-next does with the findings its review role returns (change
# 0218). Independent of WHICH skill `skills: review:` is bound to — the threshold is applied by
# the implementer, not by the reviewer.
review:
  # min_fix_severity — the lowest review-finding severity that docket-implement-next's Step 6 fix
  # loop repairs in-branch, on the open feature branch, before the PR opens. minor (default) => every
  # finding the reviewer returns is a fix candidate. important => minors are recorded in the PR body
  # instead of fixed. blocker => nothing but blockers is fixed, which is docket's pre-0218 behavior,
  # kept as a compat escape hatch. Blockers are ALWAYS fixed regardless of this value: a run cannot
  # proceed past an unfixed blocker. Routing a fix to a model profile is by the fix's CHARACTER, not
  # its severity, and never reaches the `max` profile; severity sets only what happens when a fix
  # fails. Anything other than these three values is a config error, not a silent fallback.
  # scope: any layer (.docket.yml, .docket.local.yml, or global config.yml)
  min_fix_severity: minor
  # max_fix_tasks — the most non-blocker fix TASKS that same loop dispatches in one run. The unit is
  # the TASK, not the finding: minors sharing a routed profile are batched into one task, which
  # spends one slot. Blockers are NEVER counted against it — a run cannot proceed past an unfixed
  # blocker, so a cap that counted them would disarm the gate the blocker floor exists to protect.
  # Overflow findings are recorded in the PR body as deferred, with the cap named as the reason, and
  # the slots fill in the loop's deterministic dispatch order so two runs over the same findings fix
  # the same set. 0 is legal and means "fix nothing but blockers". Anything that is not a
  # non-negative integer is a config error, not a silent fallback.
  # scope: any layer (.docket.yml, .docket.local.yml, or global config.yml)
  max_fix_tasks: 10


# ═══ Gate execution ════════════════════════════════════════════════════════════════════════

# gate_observation_budget — (change 0223) how long, in MINUTES, docket is willing to await a
# terminal result from a build gate it started. The gate must not assume the suite fits inside a
# single foreground call: it runs durably, records its outcome to a durable artifact, and the
# agent establishes completion from that artifact rather than from the completion signal of the
# command that started it. This budget bounds that observation. When it expires with no terminal
# result, the gate FAILS CLOSED — a halt for a human, never a red suite and never an
# integration-repair task, because an unfinished run is not a failing suite.
# It is docket execution policy, distinct from any foreground-call timeout a particular harness
# imposes; no harness figure belongs here. 0 is legal and means "observe once, then fail closed".
# Anything that is not a non-negative integer is a config error, not a silent fallback.
# scope: any layer (.docket.yml, .docket.local.yml, or global config.yml)
gate_observation_budget: 30

# delegation_observation_budget — (change 0271) how long, in MINUTES, docket is willing to await a
# terminal result from a DELEGATED RUNNER CHILD it launched. Runner delegation detaches the child
# so it can outlive the single foreground call that started it; the facade then observes a durable
# sentinel rather than blocking on the child. This budget bounds that observation. When it expires
# with no sentinel, the facade KILLS the detached process group and reports the run unavailable —
# no unwatched agent keeps working on the repo after its run was declared failed.
# Distinct from gate_observation_budget on purpose: that one bounds awaiting a suite run started by
# an agent, this one bounds awaiting a whole agent run. It is docket execution policy, distinct from
# any foreground-call timeout a particular harness imposes; no harness figure belongs here.
# 0 is legal and means "observe once, then fail closed".
# Anything that is not a non-negative integer is a config error, not a silent fallback.
# scope: any layer (.docket.yml, .docket.local.yml, or global config.yml)
delegation_observation_budget: 60


# ═══ Board surfaces ════════════════════════════════════════════════════════════════════════

# board_surfaces — which derived board view(s) to render. A list; [] disables the board entirely
# (it resolves to the reserved token `none` — change 0071; an empty value is never emitted,
# because empty means "nobody resolved this", a wiring bug).
#   inline  → BOARD.md on the metadata branch (offline-safe, committed)
#   github  → one-way GitHub Issues + Projects v2 mirror (scripts/github-mirror.sh)
# Default [inline] (github is strictly opt-in). [inline, github] = both; [github] = GitHub-only.
# scope: any layer (.docket.yml, .docket.local.yml, or global config.yml) — EXCEPT the `github`
#   token, which is repo-only (coordination-fenced, ADR-0019) because it mints external GitHub
#   objects: a `github` arriving from .docket.local.yml or the global config is warned-and-
#   dropped while the rest of the list is honored.
board_surfaces: [inline]

# github_project — the GitHub Projects v2 board intended to back the `github` board surface.
# `auto` (default) means UNMINTED, i.e. no board configured — identical in effect to omitting the
# key. The intended shape of an explicit value is:
#   github_project: {owner: my-org, number: 7}
#
#   ⚠ NOT WIRED TODAY — setting this key has NO effect in ANY layer. No script reads
#   github_project from config: github-mirror.sh resolves its board only from --project /
#   --auto-create-project, and docket-status.sh populates those only from its own CLI flags,
#   which no skill passes. The key's sole live effect is the coordination-key fence
#   (docket-config.sh's `for _fkey in metadata_branch integration_branch …` fence loop), which
#   warns-and-ignores it in the machine-scoped layers. Enabling
#   `github` in board_surfaces therefore mirrors ISSUES only; no Projects v2 board is created or
#   synced, and nothing is written back over `auto`. The scope tag below records where the key
#   WILL be settable once the read is wired — it is not a claim that it works now.
# scope: repo-only (coordination-fenced, ADR-0019) — enforced by the fence; read by nothing yet
github_project: auto


# ═══ Publishing & autonomy ═════════════════════════════════════════════════════════════════

# terminal_publish — the terminal-record publish opt-in (changes 0064/0084). DEFERRED FROM GO v1:
# the key remains a parseable, coordination-fenced configuration value but activates nothing.
# terminal publication is deferred from Go v1 — `docket finalize closeout` is the complete
# automated closeout boundary. Terminal records stay on the metadata branch; the integration
# branch gets code, plans, and results via PRs alone. An enabled value copies nothing onto the
# integration branch and is not a Bash fallback; existing published records remain as history.
# scope: repo-only (coordination-fenced, ADR-0019)
terminal_publish: false

# auto_groom — the repo-wide default for autonomous grooming (docket-auto-groom). false
# (default) keeps every needs-brainstorm stub in the interactive queue. A per-change
# `auto_groomable:` field overrides this either way; unset on a change means "inherit this knob".
# scope: any layer (.docket.yml, .docket.local.yml, or global config.yml)
auto_groom: false

# change_types — (change 0127) the taxonomy every new change is classified into. Ordered,
# non-empty, duplicate-free, lowercase [a-z][a-z0-9-]*. The default borrows the familiar
# Conventional Commit vocabulary without making docket's lifecycle depend on Conventional Commits.
# A higher layer REPLACES this whole list rather than merging with it, so you can remove a built-in
# value instead of only ever adding to it. `all` and `untyped` are reserved (a config selector and
# a query pseudo-value) and may never appear here or in a change file.
# scope: any layer (.docket.yml, .docket.local.yml, or global config.yml)
change_types: [chore, docs, feat, fix, refactor, perf]

# auto_capture — (change 0091; became a MAP in change 0127) the intended shape for turning mid-run
# discovered work into a proposed stub. DEFERRED FROM GO v1: the map remains a parseable
# configuration key and its stored values are never rewritten, but it activates nothing.
# automatic change capture is deferred from Go v1 — capture work deliberately with
# `docket change create`. An AUTONOMOUS run (implement-next's reconcile/review, a close-out
# finding) reports the follow-up work it surfaces in its final report; an enabled value is answered
# with a capability-specific unsupported diagnostic before any leg mutates state, never a Bash
# fallback.
#
# BREAKING (change 0127): the old scalar `auto_capture: true|false` is no longer valid and has no
# compatibility shim — it fails closed with a diagnostic printing the nested replacement.
#
# Leaves resolve INDEPENDENTLY, so a machine-local layer can flip `enabled` while inheriting
# `types` from the committed layer. Both leaves fail closed on garbage. They document the shape
# capture would take; neither leg runs while capture is deferred from Go v1.
#   enabled — the read/parse gate for the (deferred) capture leg.
#   types   — `all` (every effective change_type) or a list drawn from change_types, e.g.
#             [feat, fix] to keep chores and docs findings out of the backlog. A list REPLACES
#             `all` rather than narrowing it in place.
# scope: any layer (.docket.yml, .docket.local.yml, or global config.yml)
auto_capture:
  enabled: false
  types: all

# dummy_mode — rewrite docket's HUMAN-FACING prose for a reader you describe. When a question from
# a groom or a run report assumes vocabulary or language expertise you do not have, this stops you
# from having to ask "simplify that" every time. Agent-facing artifacts (plans, specs, learnings,
# build evidence) always keep full technical density — only what a human reads changes.
#   enabled  — off by default.
#   persona  — WHO the reader is, in your own words: what they know, what they do not, and how
#              trade-offs should be framed. Leave it blank to get the shipped default (a mid-level
#              engineer, architecture-literate, working-level in any one language, all project
#              jargon glossed). ONE QUOTED LINE — a YAML block scalar (`>` or `|`) and a `#` inside
#              the value, quoted or not, are both hard errors, because the config reader is
#              line-oriented and strips from the first `#`. A `#` after the closing quote is an
#              ordinary trailing comment and is fine.
#   surfaces — `all` (default) or a subset of: dialogue, reports, results, change-sections, pr.
#              The first two are REWRITTEN for the persona; the last three keep their technical
#              content and gain an authored "In plain terms" block. An empty list means none.
# Primarily a per-repo setting: the persona describes THIS repo's reader, and the same person may
# be an expert in one repo's domain and a novice in another's.
# scope: any layer (.docket.yml, .docket.local.yml, or global config.yml)
dummy_mode:
  enabled: false
  persona: ""
  surfaces: all


# ═══ Agent harnesses & per-skill models ════════════════════════════════════════════════════

# agent_harnesses — which harnesses the PER-REPO agent pass generates wrapper files for.
# Value default is [claude]. But PRESENCE in a repo file is itself the opt-in to per-repo wrapper
# generation: a repo that adopts docket for change-tracking only, with neither this key nor
# `agents:` set anywhere, generates no wrappers and keeps `sync-agents.sh --check` a no-op.
# To enable another harness: add it here AND uncomment that harness's block under `agents:`,
# then re-run install.sh. Model IDs pass through verbatim; unknown tokens are warned + dropped.
# A KNOWN-but-unmapped harness token (no named emitter, e.g. `agents`, `kiro`, `windsurf`) is a
# different case: it is warned and KEPT — its wrappers still generate, Claude-shaped and
# unverified (ADR-0060) — and `sync-agents.sh --check` reports it as a non-failing advisory.
# A GLOBAL value (~/.config/docket/config.yml) means something different: it scopes
# sync-agents.sh's USER-LEVEL pass only (which harnesses get ~/.claude/agents/docket-*.md, etc.)
# and never opts any repo into the per-repo generation pass above — that opt-in is presence in a
# REPO file (this key or `agents:`, in .docket.yml or .docket.local.yml) and only that.
# AT INSTALL TIME (change 0351) this same key is the EXPLICIT opt-in for a repository's
# parent-facing dispatch surfaces, which `docket development install` (reached through the
# install.sh bootstrapper) reconciles for you in Go — no separate script to run. It has three
# states: absent leaves the shipped default (Claude only) and touches no other harness's
# repository surfaces; a non-empty list reconciles exactly the harnesses named; and an explicit
# empty list ([]) retires every docket-owned repository surface the repo previously had. The same
# install run also retires the old GLOBAL parent-facing dispatch blocks earlier docket versions
# wrote into personal instruction files — proof-gated (exact ownership marker only), with no
# --force, leaving a modified block untouched to remedy-and-rerun.
# PRESENCE-SENSITIVE: uncommenting this key changes behavior even at these default values.
# scope: any layer (.docket.yml, .docket.local.yml, or global config.yml)
# agent_harnesses: [claude]

# agents — per-skill subagent model/effort (change 0016), harness-first (change 0046). Generated
# into agent wrappers by sync-agents.sh. Keys are skill SHORT names nested under a reserved
# `default:` (the harness-neutral fallback) and, optionally, per-harness override keys (e.g.
# `cursor:`) that only need to list the fields that differ; resolution is field-by-field:
# agents.<harness>.<agent> -> agents.default.<agent> -> shipped built-in
# (agents/harness-defaults.yml) -> unpinned (the harness applies its own default).
# Write model/effort values unquoted and space-free; `#` cannot appear inside the `{…}` flow map —
# docket strips comments before parsing, so an in-map `#` truncates the value and generation is
# refused rather than shipping a clipped pin.
# `effort: auto` explicitly drops the effort line (inherit the model default); omitting the
# `effort:` key instead keeps the built-in effort — auto and omitted are NOT equivalent. 17 wrapper
# files ship (agents/docket-*.md; their shipped model/effort live in agents/harness-defaults.yml,
# mirrored below): 5 wrap one of the 5 autonomous skills (adr, auto-groom, finalize-change,
# implement-next, status); 4 (build-economy, build-standard, build-premium, build-max) are
# docket-build's task workers and all preload the same docket-build-task
# worker skill, differing only in model/effort; 3 (review-lean, review-standard, review-deep) are
# docket-review's rung wrappers and all preload the same docket-review worker skill, likewise
# differing only in model/effort; the other 5 (auto-groom-critic,
# brainstorm-consultant, integration-repair, plan-writer, rebase-resolver) are standalone agents
# those skills dispatch and wrap no skill of their own. new-change/groom-next are advisory-only
# skills with no wrapper and ignore this block.
# Configuring a skill here overrides its model/effort in the generated, machine-local
# .<harness>/agents/docket-<skill>.md — which is regenerated for every built-in regardless (full
# set; this block is OVERRIDE-ONLY, tuning model/effort and never deciding which agents exist),
# gitignored via a managed .gitignore block, and never committed. Run `sync-agents.sh` after
# editing, and `sync-agents.sh --check` in CI to catch a missing/stale .gitignore block or an
# accidentally-tracked generated file (content drift itself is advisory only — every clone
# regenerates its own copy). A `cursor` harness additionally gets a generated
# .cursor/rules/docket-dispatch.mdc dispatch rule; sync-agents.sh prunes orphaned docket-* files.
# An entry may also carry a `runner:` key (e.g. `runner: codex`) alongside `model:`/`effort:` to
# delegate that agent's whole run to a child harness with its own subscription, models, and
# skills — see the `runners:` block below. A delegated entry MUST carry an explicit `model:`
# (ADR-0067): docket never forwards its own shipped default to another harness, so a model-less
# `runner:` is a generation-time error, not a silent run on the child's default.
#
# The `claude:`, `codex:`, `cursor:`, and `opencode:` blocks below all MIRROR docket's shipped
# built-in defaults — the values in agents/harness-defaults.yml — shown so the otherwise-invisible
# defaults are visible and tunable. Deleting any line falls back to the SAME shipped default. The
# sidecar is the single source of truth; this mirror never leads, and tests/test_docket_example_yml.sh
# enforces the equality. If a shipped default changes, update this mirror to match. All four shipped
# harnesses are complete — every one of the seventeen agents carries a model and an effort under each.
