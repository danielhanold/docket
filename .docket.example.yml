# .docket.example.yml — every configuration key docket supports, with its built-in default.
#
# This file is documentation: docket never reads it. Each key below carries a short note on what
# it does and the value it has when you set nothing.
#
# ── Layers ────────────────────────────────────────────────────────────────────────────────
# docket reads four layers. For each key, the highest layer that sets it wins:
#   1. machine-local  <repo>/.docket.local.yml                         (this clone; gitignored)
#   2. committed      <repo>/.docket.yml                               (every clone)
#   3. global         ${XDG_CONFIG_HOME:-$HOME/.config}/docket/config.yml  (every repository on this machine)
#   4. built-in       the defaults compiled into docket
# Nested blocks merge key by key: setting one key in a block leaves its other keys resolving from
# the layers below. A malformed file, an unknown key, or a bad value in any layer makes the whole
# configuration invalid, and docket refuses to change the repository until it is fixed.
# `docket diagnostic config --repo-dir .` shows the resolved configuration and anything that
# blocks writes.
#
# ── Copying this file ─────────────────────────────────────────────────────────────────────
# Safe to copy: copied verbatim as `.docket.yml`, it behaves exactly like having no file, because
# every active value below is the built-in default. Copy only the keys you want to change.
# For `.docket.local.yml` or the global config, copy only `scope: any layer` keys: the four
# `scope: repo-only` keys are ignored with a warning there.
#
# ── Scope tags ────────────────────────────────────────────────────────────────────────────
# Every key carries one:
#   # scope: repo-only (shared-setting guarded)
#       Settable only in the committed .docket.yml; a machine layer's value is ignored with a
#       warning, so one clone cannot move shared planning state.
#   # scope: any layer
#       Settable in .docket.yml, .docket.local.yml, or the global config.
#   # scope: global-only (global config.yml)
#       Honoured only from the global config.
#
# A new key lands here, with its documentation, in the same change that adds it; a test enforces
# that every supported key appears in this file.


# ═══ Branch model & layout ════════════════════════════════════════════════════════════════

# integration_branch — the branch code lands on, where pull requests merge. `auto` (the default)
# resolves to the repository's default branch (origin/HEAD); name a branch to use another one.
# scope: repo-only (shared-setting guarded)
integration_branch: auto

# changes_dir / adrs_dir / results_dir — where the change files (and the board), the ADR ledger,
# and the results records live on the `docket` branch, relative to its root. Each must be a clean
# relative path inside the repository.
# scope: repo-only (shared-setting guarded)
changes_dir: docs/changes
adrs_dir: docs/adrs
results_dir: docs/results


# ═══ finalize — merging a finished change ═════════════════════════════════════════════════

# Before it merges, finalize rebases the feature branch onto its base and re-runs the test suite,
# so a branch that fell behind cannot land a broken integration branch.
finalize:
  # gate — local (default): rebase and re-run finalize.test_command before merging.
  # off: skip the rebase and the re-run, and merge on the pull request as it stands.
  # scope: any layer
  gate: local

  # test_command — the suite finalize runs after its rebase. "" (the default) is unconfigured: a
  # local gate with no command stops and names `docket repository configure-tests` as the remedy.
  # scope: any layer
  test_command: ""

  # require_pr_approval — false (default): finalize may merge an eligible change it picked on its
  # own. true: such a merge needs an approval first. Naming the change by id always counts as
  # the approval.
  # scope: any layer
  require_pr_approval: false

  # resolver_max_attempts — how many times finalize may send in the conflict resolver during one
  # rebase before it stops and hands the conflict to you. 10 by default; a whole number of 1 or
  # more. A new value applies to the next finalize, never to a rebase already under way.
  # scope: any layer
  resolver_max_attempts: 10

  # repair_max_attempts — how many fix attempts the integration-repair agent gets, the first one
  # included, when the suite is red after the rebase. 6 by default; 1 allows a single repair.
  # A whole number of 1 or more.
  # scope: any layer
  repair_max_attempts: 6


# ═══ build — the build gate ═══════════════════════════════════════════════════════════════

build:
  # gate — local (default): after every plan task is built, run build.test_command once; a green
  # run becomes the change's build evidence. off: run nothing and record `skipped` evidence.
  # scope: any layer
  gate: local

  # test_command — the suite the build gate runs. "" (the default) is unconfigured: a local build
  # gate stops and names `docket repository configure-tests` as the remedy. It is independent of
  # finalize.test_command; the two may differ.
  # scope: any layer
  test_command: ""

  # max_attempts — how many full suite runs a build may spend: the first run plus one repair and
  # re-run for each red result. 4 by default (three repairs); 1 stops at the first red run.
  # A whole number of 1 or more.
  # scope: any layer
  max_attempts: 4


# ═══ run — the implement-next run tracker ═════════════════════════════════════════════════

run:
  # max_attempts — how many attempts a tracked implement-next run may make on one change: the
  # first attempt plus retries after an incomplete run. 2 by default (one retry); 1 disables
  # retries. A halt always waits for a human. A whole number of 1 or more.
  # scope: any layer
  max_attempts: 2


# ═══ review — what implement-next fixes after review ══════════════════════════════════════

review:
  # min_fix_severity — the lowest review-finding severity the fix pass repairs on the feature
  # branch before the pull request opens: minor (default), important, or blocker. Blockers are
  # always fixed; a finding below the threshold is recorded in the pull request instead.
  # scope: any layer
  min_fix_severity: minor

  # max_fix_tasks — the most non-blocker fix tasks one fix pass dispatches. Findings that go to the
  # same build tier share one task. Blockers never count against it. Findings past the limit are
  # recorded in the pull request as deferred. 0 means fix nothing but blockers.
  # scope: any layer
  max_fix_tasks: 10


# ═══ reclaim — releasing abandoned claims ═════════════════════════════════════════════════

reclaim:
  # lease_ttl — hours a claim on an in-progress change lasts. A change whose lease has expired,
  # with no feature branch and no workspace, is eligible to return to the backlog.
  # scope: any layer
  lease_ttl: 72

  # auto — false (default): `docket maintenance sweep` reports an eligible change as skipped
  # (reclaim-auto-disabled). true: the sweep reclaims it.
  # scope: any layer
  auto: false


# ═══ learnings — the learnings ledger ═════════════════════════════════════════════════════

learnings:
  # enabled — true (default): `docket learning record` and `docket learning update` write findings,
  # and grooming, planning, and review read them. false: those writes are refused and nothing
  # reads the ledger. Existing findings are left in place.
  # scope: any layer
  enabled: true


# ═══ Gate observation ═════════════════════════════════════════════════════════════════════

# gate_observation_budget — how many minutes docket waits for a test-suite run it started to
# reach a final result. When the time runs out with no result, the run stops for a human; it is
# not treated as a red suite. 0 means look once, then stop.
# scope: any layer
gate_observation_budget: 30


# ═══ Board ════════════════════════════════════════════════════════════════════════════════

# board_surfaces — which board views to render. [inline] (the default) writes BOARD.md on the
# `docket` branch; [] renders no board.
# scope: any layer
board_surfaces: [inline]

# board — how the inline board lays out the backlog. Presentation only.
# section_order must list every section exactly once; a list with a missing, unknown, or repeated
# section is ignored with a warning and the order from a lower layer applies.
# sorting.<section>.by is id, updated, or created; .direction is asc or desc. An invalid value is
# ignored with a warning, on its own.
# scope: any layer
board:
  section_order: [in-progress, built, blocked, groomed, proposed, deferred]
  sorting:
    in-progress:
      by: updated
      direction: desc
    built:
      by: updated
      direction: desc
    blocked:
      by: updated
      direction: desc
    groomed:
      by: updated
      direction: desc
    proposed:
      by: updated
      direction: desc
    deferred:
      by: updated
      direction: desc


# ═══ Change types ═════════════════════════════════════════════════════════════════════════

# change_types — the types a change can be classified as. Ordered, non-empty, no repeats, each
# lowercase [a-z][a-z0-9-]*. A higher layer replaces the whole list, so you can remove a built-in
# type as well as add one. `all` and `untyped` are reserved and may not appear.
# scope: any layer
change_types: [chore, docs, feat, fix, refactor, perf]


# ═══ Agent harnesses & agent models ═══════════════════════════════════════════════════════

# agent_harnesses — which harnesses this repository's dispatch surfaces are installed for. It has
# no default: while it is absent, install touches no repository surface. Listing harnesses
# (claude, codex, cursor, opencode) installs the managed block in CLAUDE.md / AGENTS.md and, for
# cursor, .cursor/rules/docket-dispatch.mdc. Only .docket.yml or .docket.local.yml can opt a
# repository in; the installer ignores a value in the global config.
# scope: any layer
# agent_harnesses: [claude]

# agents — model and effort pins for docket's agents, per harness. Agent definitions are
# installed for your user only (~/.claude/agents/, ~/.codex/agents/, ~/.cursor/agents/,
# ${XDG_CONFIG_HOME:-~/.config}/opencode/agents/), seventeen per harness. The blocks below show
# the built-in values as a starting point; agents/harness-defaults.yml ships the same table.
# Pins apply per agent and per field; a line you leave out keeps its built-in value. A `default:`
# block applies to every harness that has no pin of its own for that agent. Model IDs and effort
# tokens pass through unchecked; `effort: auto` writes no effort line, so the harness picks.
# Re-run `docket install` after editing.
